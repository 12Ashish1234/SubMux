[package]
name = "submux"
version = "0.1.2"
description = "Fast lossless subtitle muxer for macOS"
authors = ["SubMux"]
edition = "2021"

[lib]
name = "submux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-opener = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
